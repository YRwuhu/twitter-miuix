[package]
name = "twitter-miuix"
version = "0.1.1"
description = "X/Twitter 第三方桌面客户端（HyperOS / miuix 风格）"
authors = ["local"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "twitter_miuix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["rt", "time", "macros"] }
base64 = "0.23.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "multipart"] }
urlencoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
